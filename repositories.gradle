// Add any additional repositories for your dependencies here.

repositories {
    maven {
        url "https://maven.angelic.industries/releases"
    }
    maven {
        name = "FalsePattern Maven"
        url = "https://mvn.falsepattern.com/releases/"
    }
    maven {
        name = "Ventooth Maven"
        url = "https://mvn.ventooth.com/releases/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Angelic GitHub releases"
                url = uri("https://maven.angelic.industries/github/")
            }
        }
        filter {
            includeGroup("Myask-s")
            includeGroup("jss2a98aj")
            includeGroup("kanmikan")
        }
    }
}
